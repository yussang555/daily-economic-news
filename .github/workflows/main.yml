name: Daily Economic News

on:
  schedule:
    # 매일 한국 시간 오전 7시 (세계 표준시 기준 22시)
    - cron: '0 22 * * *'
  workflow_dispatch: # 직접 실행해볼 수 있는 버튼 생성

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run script
        env:
          # 아까 금고에 넣은 값을 코드가 읽을 수 있게 연결합니다
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python news.py
